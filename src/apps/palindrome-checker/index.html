<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Palindrome Checker</title>
    <link rel="stylesheet" href="/src/shared/styles/global.css" />
    <link rel="stylesheet" href="/src/apps/palindrome-checker/styles.css" />
  </head>
  <body>
    <div class="container">
      <div class="title-container">
        <h1>Palindrome Checker</h1>
      </div>
      <div class="app-container">
        <div class="description-container">
          <p>Enter a word or phrase to check if it is a palindrome.</p>
        </div>
        <form id="form">
          <input
            type="text"
            id="word-input"
            placeholder="Enter a word or phrase"
          />
          <button type="submit" id="check-button">Check</button>
        </form>
        <div id="result-container">
          <p id="result-text"></p>
        </div>
      </div>
    </div>
    <script src="/src/apps/palindrome-checker/app.js"></script>
  </body>
</html>
